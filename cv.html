<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dariusz Masłyk — CV</title>
  <meta name="description" content="CV: Dariusz Masłyk, analityk biznesowo-systemowy (aplikacje mobilne, Comarch ERP, integracje, AI).">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root{--side:#1f2240;--accent:#7b4dff;--cyan:#0fb5b9;--ink:#1b1d2e;--muted:#5a5f7a}
    *{box-sizing:border-box}
    body{margin:0;background:#e9e8f3;font-family:"Segoe UI",Inter,system-ui,sans-serif;color:var(--ink)}
    .page{display:grid;grid-template-columns:270px 1fr;max-width:1000px;margin:24px auto;background:#fff;box-shadow:0 10px 40px rgba(20,20,60,.15);min-height:1100px}
    aside{background:var(--side);color:#e6e7f5;padding:34px 24px}
    aside h3{margin:26px 0 10px;font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;color:#9ff3f5;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:6px}
    aside ul{list-style:none;padding:0;margin:0;font-size:13px;line-height:1.55}
    aside li{margin-bottom:6px}
    aside a{color:#e6e7f5}
    .logo{width:86px;height:86px;border-radius:22px;display:grid;place-items:center;font:800 32px "Segoe UI",sans-serif;color:#fff;background:linear-gradient(135deg,#9b5cff,#2de2e6)}
    main{padding:38px 40px}
    h1{margin:0;font-size:38px;letter-spacing:.5px}
    .title{margin:6px 0 2px;color:var(--accent);font-size:19px;font-weight:700}
    .sub{margin:0 0 16px;color:var(--muted);font-size:14px}
    .lead{font-size:14.5px;line-height:1.6;color:#2f3247}
    h2{margin:26px 0 12px;font-size:14px;letter-spacing:1.4px;text-transform:uppercase;border-bottom:1px solid #d9dbea;padding-bottom:6px}
    .job{margin-bottom:14px;break-inside:avoid}
    .job-h{display:flex;justify-content:space-between;align-items:baseline}
    .job-h b{font-size:17px}.job-h span{color:var(--muted);font-size:13px}
    .role{color:var(--cyan);font-weight:600;font-size:14px;margin:2px 0 4px}
    .job ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;line-height:1.5;color:#33364c}
    .proj{margin-bottom:8px;font-size:13.5px;line-height:1.5}
    .lang{position:fixed;top:14px;right:14px;padding:8px 14px;border-radius:10px;background:var(--side);color:#fff;text-decoration:none;font:700 13px sans-serif}
    .back{position:fixed;top:14px;left:14px;padding:8px 14px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font:700 13px sans-serif}
    @media (max-width:760px){ .page{grid-template-columns:1fr;margin:0} main{padding:28px 20px} .lang,.back{position:static;display:inline-block;margin:10px 6px} }
    @media print{
      @page{size:A4;margin:0}
      body{background:#fff}
      .page{margin:0;box-shadow:none;max-width:none;min-height:297mm;grid-template-columns:72mm 1fr;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .lang,.back,.noprint{display:none}
      .page{height:297mm;min-height:0;overflow:hidden}
      main{padding:10mm 10mm 8mm}
      aside{padding:10mm 7mm}
      aside h3{margin:16px 0 7px;font-size:10.5px}
      aside ul{font-size:11.2px;line-height:1.42}
      aside li{margin-bottom:3px}
      .logo{width:64px;height:64px;font-size:24px;border-radius:16px}
      h1{font-size:30px}
      .title{font-size:16px}
      .sub{font-size:12px;margin-bottom:10px}
      .lead{font-size:12.3px;line-height:1.5;margin:0}
      h2{margin:14px 0 8px;font-size:11.5px}
      .job{margin-bottom:8px}
      .job-h b{font-size:14px}.job-h span{font-size:11.5px}
      .role{font-size:12px;margin:1px 0 2px}
      .job ul{font-size:11.4px;line-height:1.38}
      .proj{font-size:11.4px;line-height:1.4;margin:0 0 5px}
    }
  </style>
</head>
<body>
  <a class="back noprint" id="back" href="./">← Pokój 3D</a>
  <a class="lang noprint" id="langLink" href="?lang=en">EN</a>
  <div class="page" id="cv"></div>
  <script type="module">
    import { TEXT, PROFILE } from "./js/content.js";
    const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "pl";
    const T = TEXT[lang], P = T.panels;
    const L = lang === "en"
      ? { contact: "Contact", analysis: "Analysis & design", tech: "Technology", ai: "AI in analyst work", certs: "Certificates", exp: "Experience", projects: "Side projects", edu: "Education", back: "← 3D room", other: "PL" }
      : { contact: "Kontakt", analysis: "Analiza i projektowanie", tech: "Technologie", ai: "AI w pracy analityka", certs: "Certyfikaty", exp: "Doświadczenie zawodowe", projects: "Projekty", edu: "Wykształcenie", back: "← Pokój 3D", other: "EN" };
    document.documentElement.lang = lang;
    document.getElementById("back").textContent = L.back;
    const ll = document.getElementById("langLink"); ll.textContent = L.other; ll.href = lang === "en" ? "?lang=pl" : "?lang=en";
    const e = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const list = a => "<ul>" + a.map(x => "<li>" + e(x) + "</li>").join("") + "</ul>";
    const g = P.board.groups;
    document.getElementById("cv").innerHTML =
      '<aside><div class="logo">DM</div>' +
      "<h3>" + L.contact + "</h3><ul>" +
        "<li>" + e(PROFILE.city) + "</li>" +
        '<li><a href="mailto:' + PROFILE.email + '">' + e(PROFILE.email) + "</a></li>" +
        '<li><a href="' + PROFILE.linkedin + '">linkedin.com/in/dariusz-maslyk</a></li>' +
        '<li><a href="' + PROFILE.github + '">github.com/backloghero-lang</a></li>' +
        '<li><a href="https://backloghero-lang.github.io/cv-interactive-3d/">backloghero-lang.github.io/cv-interactive-3d</a></li></ul>' +
      "<h3>" + L.analysis + "</h3>" + list(g[0][1]) +
      "<h3>" + L.tech + "</h3>" + list(g[1][1]) +
      "<h3>" + L.ai + "</h3>" + list(g[2][1]) +
      "<h3>" + L.certs + "</h3>" + list(P.shelf.certs.map(c => c[0] + " (" + c[1] + ")")) +
      "</aside><main>" +
      "<h1>DARIUSZ MASŁYK</h1>" +
      '<p class="title">' + e(T.title) + '</p><p class="sub">' + e(T.subtitle) + "</p>" +
      '<p class="lead">' + e(P.desk.lead) + "</p>" +
      "<h2>" + L.exp + "</h2>" +
      P.wall.jobs.map(j => '<div class="job"><div class="job-h"><b>' + e(j.co) + "</b><span>" + e(j.years) + '</span></div><p class="role">' + e(j.role) + "</p>" + list(j.points) + "</div>").join("") +
      "<h2>" + L.projects + "</h2>" +
      P.console.projects.map(p => '<p class="proj"><b>' + e(p.name) + "</b> — " + e(p.desc) + "</p>").join("") +
      "<h2>" + L.edu + "</h2><p class='proj'>" + e(P.shelf.edu) + "</p>" +
      "</main>";
    document.title = "Dariusz Masłyk — CV";
  </script>
</body>
</html>
